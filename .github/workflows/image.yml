# SPDX-License-Identifier: Unlicense
# Every pull request, push to main and tag: the image on amd64 and arm64, its tools checked and its
# scripts' tests run in it. Each variant is built once per content of image/: the build is kept as
# ghcr.io/overpressure/builder:ci-<image/'s tree>-<arch>, and a later run (main after the merge, the tag)
# pulls it instead of building it again. A tag (YYYY.MM.DD, or YYYY.MM.DD.N for a second one that day)
# publishes the tested variants as one multi-arch image, ghcr.io/overpressure/builder:TAG, and a release
# naming its digest, with each variant's packages and versions and what changed since the previous release.
# The last job, ci, passes only when the lint and both variants passed: the one check main's ruleset requires.
name: Image

on:
  push:
    branches: [main]
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/overpressure/builder

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.26"
      - name: The Python code, overpressure's ruff (pyproject.toml)
        run: |
          uvx ruff@0.17.4 format --check .
          uvx ruff@0.17.4 check .
      # DL3008 (pin apt packages' versions) is off on purpose: the packages are Ubuntu's as they are when the
      # image is built, and the published image, pinned by digest, is what pins a build's tools (Dockerfile).
      - name: The Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --ignore DL3008 - < image/Dockerfile
      - name: The workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # a tag's variant
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: The variant's content
        id: content
        run: echo "candidate=$IMAGE:ci-$(git rev-parse HEAD:image)-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
      - name: The registry
        id: registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "push=true" >> "$GITHUB_OUTPUT"
      - name: An earlier build of the same content
        id: earlier
        env:
          CANDIDATE: ${{ steps.content.outputs.candidate }}
        run: |
          if docker pull "$CANDIDATE"; then
            docker tag "$CANDIDATE" builder:test
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The image
        if: steps.earlier.outputs.found != 'true'
        run: docker build --pull -t builder:test image
      - name: Its tools
        run: |
          cross=aarch64-linux-gnu-
          [ "${{ matrix.arch }}" = arm64 ] && cross=
          docker run --rm --entrypoint bash builder:test -euc "
            ${cross}gcc --version | head -1
            ${cross}ld --version | head -1
            pahole --version
            dtc --version
            clang-20 --version | head -1
            ld.lld-20 --version
            qemu-aarch64-static --version | head -1
            make --version | head -1
            python3 --version
            git --version
            shellcheck --version | sed -n 2p
            for script in overpressure-entrypoint overpressure-binfmt overpressure-hand-back; do
              [ -x /usr/local/bin/\$script ]
            done
            wc -l < /usr/share/overpressure-packages.txt"
      - name: Its scripts' tests, in it, as a build runs them
        run: |
          docker run --rm --privileged -v "$PWD:/work" builder:test bash -euc '
            shellcheck image/*.sh
            python3 -m unittest -v'
      - name: Its packages
        run: docker run --rm --entrypoint cat builder:test /usr/share/overpressure-packages.txt > packages-${{ matrix.arch }}.txt
      - name: Kept for the next run
        if: steps.earlier.outputs.found != 'true' && steps.registry.outputs.push == 'true'
        env:
          CANDIDATE: ${{ steps.content.outputs.candidate }}
        run: |
          docker tag builder:test "$CANDIDATE"
          docker push "$CANDIDATE"
      - name: The variant
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag builder:test "$IMAGE:$GITHUB_REF_NAME-${{ matrix.arch }}"
          docker push "$IMAGE:$GITHUB_REF_NAME-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: packages-${{ matrix.arch }}.txt
          if-no-files-found: error

  publish:
    needs: [lint, image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the history and the tags: what changed since the previous release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
      - name: The multi-arch image
        id: image
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" \
            "$IMAGE:$GITHUB_REF_NAME-amd64" "$IMAGE:$GITHUB_REF_NAME-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$GITHUB_REF_NAME@$digest"
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # The previous release: the one whose tag sorts last before this one by version; none for the first.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' > releases
          previous=$({ cat releases; echo "$GITHUB_REF_NAME"; } | sort -uV | grep -xF -B1 "$GITHUB_REF_NAME" | head -n -1)
          if [ -n "$previous" ]; then
            gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern 'packages-*.txt' --dir previous
            {
              echo "## Changes"
              echo
              git log --no-merges --format='- %s' "$previous..$GITHUB_REF_NAME" -- image/ | grep . || echo "- none in image/"
              echo
              echo "## Packages since $previous"
              for arch in amd64 arm64; do
                echo
                echo "### $arch"
                echo
                # Each line: package, version, architecture (and, from the release after 2026.11.12 on, source
                # package and version); a package is its name and architecture.
                awk 'NR == FNR { old[$1 " " $3] = $2; next }
                     { new[$1 " " $3] = $2 }
                     END {
                       for (k in new) {
                         split(k, p, " ")
                         if (!(k in old)) print "- added: " p[1] " " new[k]
                         else if (old[k] != new[k]) print "- changed: " p[1] " " old[k] " -> " new[k]
                       }
                       for (k in old) if (!(k in new)) { split(k, p, " "); print "- removed: " p[1] " " old[k] }
                     }' "previous/packages-$arch.txt" "packages-$arch.txt" | sort -k3,3 > "changes-$arch"
                if [ -s "changes-$arch" ]; then cat "changes-$arch"; else echo "- none changed"; fi
              done
            } > changes.md
          fi
          {
            echo "Pin it as:"
            echo
            echo '```'
            echo "$IMAGE:$GITHUB_REF_NAME@$DIGEST"
            echo '```'
            echo
            echo "Built from image/ as of ${GITHUB_SHA}, tested and published as it was built; the packages of each variant are attached."
            echo
            if [ -f changes.md ]; then cat changes.md; echo; fi
            echo "The image holds Ubuntu 24.04's packages under their own licenses; each line of the package lists names a package, its version, architecture, source package and source version, whose sources are at https://launchpad.net/ubuntu/+source/SOURCE/VERSION (README, License)."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md packages-amd64.txt packages-arm64.txt

  # The one check main's ruleset requires: it passes only when the lint and both variants passed. A variant
  # built before is pulled, not skipped, so no job here is skipped by design: a skipped one means a job it
  # needs failed or the run was cancelled. The publication, on tags only, is not part of it.
  ci:
    if: always()
    needs: [lint, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed" >&2
            exit 1
          fi
          echo "every job passed"
